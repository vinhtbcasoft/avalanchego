name: EVM Shared
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evm-shared-required:
    if: ${{ always() }}
    needs:
      - lint_test
      - unit_test
      - unit_test_smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless all needed jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi

  lint_test:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./graft/evm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - name: Run all lint checks
        run: ../../scripts/run_task.sh lint-all-ci
      - name: Check go.mod and go.sum are up-to-date
        run: ../../scripts/run_task.sh check-go-mod-tidy

  unit_test:
    name: Unit tests (Ubuntu 24.04 AMD64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./graft/evm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - run: ../../scripts/run_task.sh test-unit
      - run: ../../scripts/run_task.sh coverage

  unit_test_smoke:
    name: Unit-test smoke (macOS 26 ARM64)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ./graft/evm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - run: ../../scripts/run_task.sh test-unit-smoke
